<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">A tub wall cut plan</title>
  <desc id="desc">Find a level reference. Position full and cut tiles. Coordinate the niche grid. Finish the outside edge</desc>
  <style>.eyebrow{font:700 17px Arial,sans-serif;letter-spacing:4px;fill:#566153}.heading{font:46px Georgia,serif;fill:#242a25}.number{font:700 20px Arial,sans-serif;fill:white}.step{font:24px Arial,sans-serif;fill:#283028}.footer{font:18px Arial,sans-serif;fill:#5d655b}</style>
  <rect width="1200" height="680" fill="#f4f2eb"/>
  <text x="50" y="45" class="eyebrow">LOKEIL  /  PROCESS NOTES  /  10</text>
  <text x="50" y="109" class="heading">A tub wall cut plan</text>
  <line x1="50" y1="210" x2="1150" y2="210" stroke="#bac2b4"/>
  <g>
      <rect x="50" y="240" width="263" height="220" rx="14" fill="#ffffff" stroke="#dcded4"/>
      <circle cx="98" cy="284" r="23" fill="#6c7868"/>
      <text x="98" y="291" text-anchor="middle" class="number">1</text>
      <text x="74" y="340" class="step">Find a level reference</text>
    </g><g>
      <rect x="337" y="240" width="263" height="220" rx="14" fill="#ffffff" stroke="#dcded4"/>
      <circle cx="385" cy="284" r="23" fill="#6c7868"/>
      <text x="385" y="291" text-anchor="middle" class="number">2</text>
      <text x="361" y="340" class="step">Position full and cut</text><text x="361" y="371" class="step">tiles</text>
    </g><g>
      <rect x="624" y="240" width="263" height="220" rx="14" fill="#ffffff" stroke="#dcded4"/>
      <circle cx="672" cy="284" r="23" fill="#6c7868"/>
      <text x="672" y="291" text-anchor="middle" class="number">3</text>
      <text x="648" y="340" class="step">Coordinate the niche</text><text x="648" y="371" class="step">grid</text>
    </g><g>
      <rect x="911" y="240" width="263" height="220" rx="14" fill="#ffffff" stroke="#dcded4"/>
      <circle cx="959" cy="284" r="23" fill="#6c7868"/>
      <text x="959" y="291" text-anchor="middle" class="number">4</text>
      <text x="935" y="340" class="step">Finish the outside edge</text>
    </g>
  <line x1="50" y1="510" x2="1150" y2="510" stroke="#bac2b4"/>
  <text x="50" y="555" class="footer">A planning sequence for the detail shown in this photograph.</text>
  <text x="50" y="590" class="footer">The final assembly depends on site conditions and selected products.</text>
  <text x="50" y="645" class="eyebrow">LOKEIL RENOVATION  ·  NEW YORK CITY</text>
</svg>