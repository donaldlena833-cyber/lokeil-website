    <pattern id="patch" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M0 26L26 0" stroke="#b7c7ab" stroke-width="4"/></pattern>
  </defs>
  <g stroke-linejoin="round" stroke-linecap="round">
    <rect x="95" y="150" width="880" height="425" fill="#fafaf3" stroke="#526751" stroke-width="4"/>
    <rect x="95" y="150" width="280" height="425" fill="url(#tile)"/>
    <rect x="425" y="188" width="500" height="335" rx="12" fill="#edf0e4" stroke="#45614a" stroke-width="5" stroke-dasharray="13 13"/>
    <path d="M539 313Q570 285 620 301L705 283Q739 310 719 364L737 426Q679 450 634 431L549 449Q518 395 539 313Z" fill="#cedac3"/>
    <path d="M539 313Q570 285 620 301L705 283Q739 310 719 364L737 426Q679 450 634 431L549 449Q518 395 539 313Z" fill="url(#patch)" stroke="#5e7655" stroke-width="3"/>
    <path d="M377 145V585" stroke="#526751" stroke-width="6"/>
