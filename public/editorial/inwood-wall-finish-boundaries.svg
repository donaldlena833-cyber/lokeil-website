    <path d="M982 280L822 235M982 330L825 376M983 378L848 493" fill="none" stroke="#bccaaa" stroke-width="7"/>
    <path d="M660 270V90M838 530V625M224 575V625" fill="none" stroke="#45614a" stroke-width="3"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="48" fill="#293b30">
    <text x="660" y="65" text-anchor="middle">Repair area</text>
    <text x="224" y="685" text-anchor="middle">Retained tile</text>
    <text x="824" y="685" text-anchor="middle">Paint boundary</text>
