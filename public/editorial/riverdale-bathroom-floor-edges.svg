<g stroke="#617261" stroke-width="4" stroke-linejoin="round">
<rect x="140" y="280" width="550" height="1040" fill="url(#floor)" stroke="none"/>
<path d="M140 280H690V1320H530M370 1320H140Z" fill="none"/>
<rect x="140" y="280" width="260" height="420" fill="#d4ddcc"/>
