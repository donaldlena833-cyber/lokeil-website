<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">The wall repair and the trim that stays</title>
  <desc id="desc">An illustrative wall elevation marks retained doorway casing, a nearby repair area, and the wall edge at a retained baseboard. No dimensions or construction system are specified.</desc>
