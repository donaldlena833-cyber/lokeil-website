<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Define the repair beside the surfaces you keep</title>
  <desc id="desc">An original scope elevation shows a retained counter, an assessed wall opening within a possible repair area, and the larger agreed paint surface. It does not prescribe an electrical or wall repair method.</desc>
  <defs><pattern id="repair" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M0 18L18 0" stroke="#A18B5E" stroke-width="2" opacity=".55"/></pattern></defs>
  <g stroke="#45614A" stroke-width="3" stroke-linejoin="round">
    <path d="M100 190H1100V510H100Z" fill="#E3E8D8"/>
    <path d="M480 270H720V470H480Z" fill="#FAFAF3"/><path d="M480 270H720V470H480Z" fill="url(#repair)"/>
    <path d="M555 318H625V420H555Z" fill="#FAFAF3"/>
    <path d="M480 270H720V470H480Z" fill="none" stroke="#A18B5E" stroke-dasharray="10 7"/>
    <path d="M100 510H1100V558H100Z" fill="#D4C7A7"/>
    <path d="M100 558H1100V680H100Z" fill="#FAFAF3"/><path d="M125 585H1075V650H125Z" fill="#D4DFD9" stroke-dasharray="10 7"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#293B30" font-size="36"><text x="100" y="105">Keep the work boundaries visible</text><text x="145" y="244" font-size="30">Agreed paint surface</text><text x="770" y="360" font-size="30">Assess the opening</text><text x="150" y="734" font-size="29">Protect retained surfaces</text></g>
  <g fill="#45614A"><circle cx="355" cy="610" r="30"/><circle cx="715" cy="365" r="30"/><circle cx="955" cy="245" r="30"/></g>
  <g font-family="Arial, sans-serif" fill="#FAFAF3" font-size="32" font-weight="bold" text-anchor="middle"><text x="355" y="621">1</text><text x="715" y="376">2</text><text x="955" y="256">3</text></g>
</svg>
