<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">A backsplash has a beginning, interruptions, and an end</title>
  <desc id="desc">An original concept kitchen elevation shows a looping tile pattern behind a range and around an outlet, ending beside a window. Three numbered points correspond to focal view, interruptions, and exposed boundaries. No dimensions or product specifications are implied.</desc>
