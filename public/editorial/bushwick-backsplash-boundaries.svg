  <g stroke="#45614A" stroke-width="3" stroke-linejoin="round">
    <path d="M100 285H915V548H100Z" fill="#FAFAF3"/><path d="M100 285H915V548H100Z" fill="url(#loops)"/>
    <path d="M100 180H340V280H100ZM650 180H815V280H650Z" fill="#E3E8D8"/>
    <path d="M398 180H565L590 285H372Z" fill="#D4C7A7"/>
    <path d="M940 235H1100V465H940Z" fill="#E3E8D8"/><path d="M955 250H1085V450H955Z" fill="#FAFAF3"/>
