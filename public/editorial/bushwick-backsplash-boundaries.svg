  <g font-family="Arial, sans-serif" font-size="35" fill="#293B30"><text x="100" y="105">See the whole wall</text><text x="340" y="340" font-size="28">Focal view</text><text x="655" y="510" font-size="28">Outlet</text><text x="940" y="520" font-size="28">Window</text></g>
